name: CI

# Builds and tests on Windows, macOS and Linux (net8.0 and net10.0). Never publishes
# anything. Runs when started by hand, on pull requests, and on pushes to main and perf/* branches.
on:
  push:
    branches: [main, "perf/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # .NET 8 runtime for the net8.0 test run; the .NET 10 SDK builds everything.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build lib-ps3-kit.sln -c Release
      - name: Test (net8.0 and net10.0)
        run: dotnet test lib-ps3-kit.sln -c Release --no-build
      - name: CLI smoke test
        run: dotnet tools/lib-ps3-kit.Cli/bin/Release/net10.0/ps3-kit.dll --help

  pack:
    name: Pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Pack the library and its tool
        run: dotnet pack lib-ps3-kit.sln -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
